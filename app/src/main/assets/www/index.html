<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FAF9F5">
  <title>Clone</title>
  <link rel="preload" href="fonts/sans.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="fonts/serif.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script>
    /* Apply the stored theme before first paint so there is never a flash. */
    (function () {
      try {
        var pref = localStorage.getItem('clone:theme') || 'system';
        var sys = (window.CloneNative && CloneNative.isSystemDark && CloneNative.isSystemDark())
          || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        var dark = pref === 'dark' || (pref === 'system' && sys);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app">
    <main id="stage"></main>
    <div id="sbscrim" aria-hidden="true"></div>
    <nav id="tabbar" role="tablist" aria-label="Sections"></nav>
  </div>
  <div id="sheet-root"></div>
  <div id="toast-root" aria-live="assertive"></div>
  <script type="module" src="js/app.js"></script>
  <script nomodule>
    document.getElementById('app').innerHTML = '<div style="padding:48px 28px;font:17px/1.5 sans-serif;text-align:center">Clone needs a newer <b>Android System WebView</b>.<br><br>Please update it from your app store, then reopen Clone.</div>';
    if (window.CloneNative) CloneNative.ready();
  </script>
</body>
</html>
